# Type "update" in the Quick Actions picker. Opens a tab that runs herdr-setup update:
# herdr-plus, herdr's agent integrations and this setup's files. herdr itself refuses to
# update from inside a herdr pane, so for herdr run herdr-setup update in a plain terminal.
# It never restarts herdr, so running agents keep going. Quick actions have no TTY,
# so scripts/agent-tab.sh makes the pane where you can watch it.
name = "Update herdr setup"
description = "herdr-plus, integrations, setup files"
command = "sh \"$HOME/.config/herdr/plugins/config/cloudmanic.herdr-plus/scripts/agent-tab.sh\" update 'sh \"$HOME/.config/herdr/plugins/config/cloudmanic.herdr-plus/scripts/herdr-setup.sh\" update'"
